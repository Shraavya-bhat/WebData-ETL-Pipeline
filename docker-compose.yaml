services:
  python_service:
    build:
      context: ./
      dockerfile: Dockerfile
    image: workshop1
    container_name: workshop_python_container
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - psql-db

  psql-db:
    image: postgres:14
    container_name: psql-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REMOVED_SECRET
      POSTGRES_DB: demo
    ports:
      - "5434:5432"
