services:
  python_service:
    build:
      context: .
      dockerfile: Dockerfile
    image: openlibrary-data-pipeline
    stdin_open: true
    tty: true
    depends_on:
      psql-db:
        condition: service_healthy

  psql-db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REMOVED_SECRET
      POSTGRES_DB: demo
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
